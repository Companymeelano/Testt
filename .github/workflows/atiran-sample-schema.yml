name: Atiran sample schema snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - arena/29e01a09-testt
    paths:
      - Atiran2-1405-7-14-15-21-49.zip
      - tools/probe_atiran_backup.py
      - .github/workflows/atiran-sample-schema.yml

permissions:
  contents: write

concurrency:
  group: atiran-sample-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-only:
    name: Restore sample and export metadata only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="Atiran$(openssl rand -hex 24)!9a"
          echo "::add-mask::$password"
          echo "ATIRAN_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name atiran-sample \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Extract backup and copy it into the disposable database container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("Atiran2-1405-7-14-15-21-49.zip")
          target = Path("${{ runner.temp }}/AtiranSample.bak")
          with ZipFile(archive) as zf:
              matches = [name for name in zf.namelist() if name.lower().endswith(".bak")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one .bak in archive, found {len(matches)}")
              with zf.open(matches[0]) as source, target.open("wb") as dest:
                  while block := source.read(1024 * 1024):
                      dest.write(block)
          print(f"Extracted sample backup ({target.stat().st_size} bytes); no rows are read by this step.")
          PY
          docker exec atiran-sample mkdir -p /var/opt/mssql/backup
          docker cp "${{ runner.temp }}/AtiranSample.bak" atiran-sample:/var/opt/mssql/backup/AtiranSample.bak

      - name: Restore and export schema metadata only
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/probe_atiran_backup.py \
            --container atiran-sample \
            --backup /var/opt/mssql/backup/AtiranSample.bak \
            --output manager/app/src/test/resources/atiran/sample-schema.json \
            --source-archive Atiran2-1405-7-14-15-21-49.zip \
            2>&1 | tee atiran-schema-probe.log

      - name: Publish generated schema manifest to this working branch
        if: success() && steps.probe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manager/app/src/test/resources/atiran/sample-schema.json
          if git diff --cached --quiet; then
            echo "Sample schema manifest is unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "schema: snapshot Atiran sample metadata"
            git push origin HEAD:arena/29e01a09-testt
          fi

      - name: Attach metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atiran-sample-schema-metadata
          path: manager/app/src/test/resources/atiran/sample-schema.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Add failure diagnostics to the run summary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Atiran sample schema probe failed"
            echo "The probe reads schema metadata only. Diagnostics follow (last 100 lines):"
            if [[ -f atiran-schema-probe.log ]]; then
              echo '```text'
              tail -n 100 atiran-schema-probe.log
              echo '```'
            fi
            if docker inspect atiran-sample >/dev/null 2>&1; then
              echo '```text'
              docker logs --tail 50 atiran-sample 2>&1 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "Atiran sample schema probe failed; schema-only diagnostics follow."
            if [[ -f atiran-schema-probe.log ]]; then
              echo "--- probe log ---"
              tail -n 100 atiran-schema-probe.log
            fi
            if docker inspect atiran-sample >/dev/null 2>&1; then
              echo "--- SQL Server container log ---"
              docker logs --tail 50 atiran-sample 2>&1 || true
            fi
          } > atiran-schema-probe-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- atiran-schema-probe-diagnostics.txt
          git commit -m "ci: capture Atiran schema probe diagnostics"
          git push origin HEAD:arena/29e01a09-testt

      - name: Remove disposable SQL Server
        if: always()
        shell: bash
        run: docker rm -f atiran-sample >/dev/null 2>&1 || true
