name: Build debug APKs (client + seller admin)

on:
  push:
    branches: ["arena/ba83e93c-testt"]
    paths: ["manager/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android platform + build-tools
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APKs (client + admin)
        working-directory: manager
        run: |
          set -o pipefail
          gradle :app:assembleDebug :admin:assembleDebug --stacktrace 2>&1 | tee ../build-full.log | tail -40

      - name: Rename APKs
        run: |
          cp manager/app/build/outputs/apk/debug/app-debug.apk meelano-manager-v16-debug.apk
          cp manager/admin/build/outputs/apk/debug/admin-debug.apk meelano-admin-v1.1-debug.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meelano-apks-debug
          path: |
            meelano-manager-v16-debug.apk
            meelano-admin-v1.1-debug.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: MEELANO v16 — client + seller admin (debug APKs)
          body: |
            دو فایل نصبی (دیباگ) — مستقیم روی گوشی نصب می‌شوند:
            • meelano-manager-v16-debug.apk — برنامه مشتری (فعال‌سازی هوشمند + اتصال خودکار + پشتیبانی)
            • meelano-admin-v1.1-debug.apk — برنامه فروشنده (صدور کد + کارت اتصال + انتقال گوشی + گزارش مصرف)
            Debug builds — install directly on the phone.
            Client connects to the shop's Atiran SQL Server automatically via the seller's connection card.
          files: |
            meelano-manager-v16-debug.apk
            meelano-admin-v1.1-debug.apk

      - name: Commit APKs to dist/ (in-chat delivery)
        run: |
          mkdir -p dist
          cp meelano-manager-v16-debug.apk meelano-admin-v1.1-debug.apk dist/
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f dist/meelano-manager-v16-debug.apk dist/meelano-admin-v1.1-debug.apk
          git commit -m "dist: debug APKs (auto-updated by CI)" || true
          git push origin HEAD:arena/ba83e93c-testt || true

      - name: Save error tail to branch (diagnostics, on failure)
        if: failure()
        run: |
          tail -c 60000 build-full.log > build-error-tail.txt || echo "no log" > build-error-tail.txt
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f build-error-tail.txt
          git commit -m "CI diagnostics (temporary, will be removed)" || true
          git push origin HEAD:arena/ba83e93c-testt || true
