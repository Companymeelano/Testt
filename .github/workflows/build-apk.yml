name: Build debug APK

on:
  push:
    branches: ["arena/ba83e93c-testt"]
    paths: ["manager/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android platform + build-tools
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: manager
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../build-full.log | tail -40

      - name: Rename APK
        run: cp manager/app/build/outputs/apk/debug/app-debug.apk meelano-manager-v7-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meelano-manager-v7-debug
          path: meelano-manager-v7-debug.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: MEELANO Manager v7 (debug APK)
          body: |
            نسخه قابل نصب (دیباگ) — مستقیم روی گوشی نصب می‌شود.
            Debug build — installs directly on the phone.
            Needs a real Atiran SQL Server connection (set it in Settings).
          files: meelano-manager-v7-debug.apk

      - name: Save error tail to branch (diagnostics, on failure)
        if: failure()
        run: |
          tail -c 60000 build-full.log > build-error-tail.txt || echo "no log" > build-error-tail.txt
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f build-error-tail.txt
          git commit -m "CI diagnostics (temporary, will be removed)" || true
          git push origin HEAD:arena/ba83e93c-testt || true
