name: Build debug APK

on:
  push:
    branches: ["arena/ba83e93c-testt"]
    paths: ["manager/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: manager
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp manager/app/build/outputs/apk/debug/app-debug.apk meelano-manager-v7-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meelano-manager-v7-debug
          path: meelano-manager-v7-debug.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: MEELANO Manager v7 (debug APK)
          body: |
            نسخه قابل نصب (دیباگ) — مستقیم روی گوشی نصب می‌شود.
            Debug build — installs directly on the phone.
            Needs a real Atiran SQL Server connection (set it in Settings).
          files: meelano-manager-v7-debug.apk
