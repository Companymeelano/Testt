name: MEELANO v7 — unified licensed app + edition APKs

# این workflow روی شاخهٔ این سشن اجرا می‌شود و APKهای نهایی را:
#   ۱) به‌عنوان Artifact و Release در گیت‌هاب می‌گذارد،
#   ۲) در پوشهٔ dist/ داخل همین شاخه کامیت می‌کند تا از محیط سندباکس هم قابل برداشت باشد.
# در صورت خطای build، دنبالهٔ کامل لاگ در build-error-tail.txt همان شاخه ذخیره می‌شود.

on:
  push:
    branches: ["arena/29e01a09-testt"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "requirements-audit.txt"
      - "tools/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run repository-wide static audit
        run: |
          python3 -m pip install -r requirements-audit.txt
          python3 tools/verify_all.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android platforms + build-tools
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || \
          "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare the original license-app signing key (never commit the extracted key)
        # Prefer a repository secret if configured. The fallback is the original install-key passphrase
        # already present in the upstream public signing configuration for this user-supplied p12.
        env:
          MEELANO_INSTALL_PASSWORD: ${{ secrets.MEELANO_INSTALL_PASSWORD || 'derakhshan-install' }}
        run: |
          set -euo pipefail
          mkdir -p app/signing
          unzip -p Test.zip Test/signing/meelano-install.p12 > app/signing/meelano-install.p12
          test -s app/signing/meelano-install.p12
          cat > keystore.properties <<EOF
          storeFile=app/signing/meelano-install.p12
          storePassword=$MEELANO_INSTALL_PASSWORD
          keyAlias=meelano
          keyPassword=$MEELANO_INSTALL_PASSWORD
          EOF
          openssl pkcs12 -in app/signing/meelano-install.p12 -nokeys -passin env:MEELANO_INSTALL_PASSWORD | openssl x509 -noout -fingerprint -sha256

      - name: Build debug editions + release of the original licensed all-in-one app
        run: |
          set -o pipefail
          gradle testUnifiedDebugUnitTest assembleDebug assembleUnifiedRelease --stacktrace --no-daemon 2>&1 | tee build-full.log | tail -80

      - name: Collect APKs and verify original installation identity/signature
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/*.apk dist/latest-unified.json
          find app/build/outputs/apk -path '*/debug/*.apk' -type f -print -exec cp -t dist/ {} +
          cp app/build/outputs/apk/unified/release/app-unified-release.apk dist/MEELANO-v7.0.1-release.apk
          APK=dist/MEELANO-v7.0.1-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='ir.meelano.visitor' versionCode='201' versionName='7.0.1'"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > signing-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: 1a2ed0dd70759d6e10c77a4641eeeb8f15972b76d99af351470216955b46d616" signing-check.txt
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          printf '{"versionCode":201,"versionName":"7.0.1","packageName":"ir.meelano.visitor","url":"https://github.com/Companymeelano/Testt/releases/download/apk-v7-c192ed08/MEELANO-v7.0.1-release.apk","sha256":"%s","signerSha256":"1a2ed0dd70759d6e10c77a4641eeeb8f15972b76d99af351470216955b46d616","size":%s}\n' "$SHA256" "$SIZE" > dist/latest-unified.json
          python3 -m json.tool dist/latest-unified.json >/dev/null
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meelano-v7-apks-debug-and-unified-release
          path: |
            dist/*.apk
            dist/latest-unified.json
          if-no-files-found: warn

      - name: Publish rolling release (download link for the phone)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v7-c192ed08
          prerelease: true
          name: MEELANO v7.0.1 — برنامهٔ یکپارچهٔ امضاشده + نسخه‌های تخصصی
          body: |
            ## نسخهٔ اصلاح‌شدهٔ برنامهٔ اصلیِ یکپارچه و لایسنس‌دار
            **`MEELANO-v7.0.1-release.apk` — فایل اصلی برای به‌روزرسانی نصب فعلی**

            این APK با همان شناسهٔ بستهٔ نسخهٔ یکپارچهٔ قبلی (`ir.meelano.visitor`) و همان گواهی امضای نصب قبلی ساخته شده است؛ آیکون اصلی حرف طلایی D حفظ می‌شود و نصب روی نسخهٔ قبلی باید بدون حذف برنامه/پاک‌شدن داده‌ها انجام شود. صفحهٔ مدیریت، فروش، انبار و مالی داخل همین برنامه است.

            `app-manager-debug.apk` یک برنامهٔ مدیرِ جداگانه با شناسه و آیکون متفاوت است؛ **برای ارتقای نصب اصلی از آن استفاده نکنید**. نسخه‌های پرسنل/فروشگاه/مودیان هم همچنان جداگانه‌اند.
          files: |
            dist/*.apk
            dist/latest-unified.json

      - name: Commit APKs + build info to dist/ (delivery into the session branch)
        if: success()
        run: |
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          {
            echo "نسخهٔ برنامهٔ یکپارچه: 7.0.1 (versionCode 201; package ir.meelano.visitor)"
            echo "گواهی امضا: نسخهٔ نصب فعلی / Pakhsh Derakhshan (fingerprint را CI بررسی می‌کند)"
            echo "APK اصلی: MEELANO-v7.0.1-release.apk"
            echo "کامیت: $(git rev-parse --short HEAD)"
            echo "تاریخ build: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Gradle: $(gradle --version | grep Gradle | head -1)"
            echo "فایل‌ها:"
            ls -la dist/ | tail -n +2
            echo "--- sha256 ---"
            (cd dist && sha256sum *.apk)
          } > dist/BUILD-INFO.txt
          git rm -q --cached build-error-tail.txt 2>/dev/null || true
          rm -f build-error-tail.txt
          git add -A -f dist/
          git commit -m "dist: APKهای نسخهٔ ۷.۰.۱ با به‌روزرسان امن (ساخت خودکار CI)" || true
          git pull --rebase --strategy-option=ours origin arena/29e01a09-testt || true
          git push origin HEAD:arena/29e01a09-testt || true

      - name: Save diagnostics on failure (so the agent can read the real error)
        if: failure()
        run: |
          { echo "=== commit: $(git rev-parse --short HEAD) ==="; tail -c 300000 build-full.log; } > build-error-tail.txt || echo "no log" > build-error-tail.txt
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f build-error-tail.txt
          git commit -m "CI diagnostics: build failure tail (temporary)" || true
          git pull --rebase --strategy-option=ours origin arena/29e01a09-testt || true
          git push origin HEAD:arena/29e01a09-testt || true
