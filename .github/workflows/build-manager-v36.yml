name: MEELANO Manager v36.36.0 debug APK

on:
  push:
    branches: ["arena/29e01a09-testt"]
    paths:
      - "manager/**"
      - "tools/audit_manager_schema.py"
      - "tools/probe_buy_formula.py"
      - "tools/probe_money_structure.py"
      - "tools/probe_atiran_backup.py"
      - ".github/workflows/build-manager-v36.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manager-v36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit required manager columns against the Atiran sample schema
        run: python3 tools/audit_manager_schema.py --manifest manager/app/src/test/resources/atiran/sample-schema.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android SDK 35
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Fetch offline Persian voice engine (sherpa-onnx AAR, pinned sha256)
        run: |
          mkdir -p manager/app/libs
          curl -fsSL -o manager/app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  manager/app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Run manager unit tests and build v36.36.0
        working-directory: manager
        run: |
          set -o pipefail
          gradle clean :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../manager-build.log | tail -80

      - name: Verify the production screen is packaged in the APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("manager/app/build/outputs/apk/debug/app-debug.apk")
          descriptor = b"Lir/meelano/manager/screens/ProductionScreen;"
          with ZipFile(apk) as archive:
              dex_files = [name for name in archive.namelist() if name == "classes.dex" or (name.startswith("classes") and name.endswith(".dex"))]
              if not any(descriptor in archive.read(name) for name in dex_files):
                  raise SystemExit("ProductionScreen is not present in the built APK dex files")
          print("ProductionScreen is packaged in the APK.")
          PY

      - name: Include Gradle diagnostics in job summary
        if: failure()
        run: |
          if [ -f manager-build.log ]; then
            {
              echo '### Manager Gradle diagnostics (last 150 lines)'
              echo '```text'
              tail -n 150 manager-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            log=$(cat manager-build.log)
            log=${log//'%'/'%25'}
            log=${log//$'\r'/'%0D'}
            log=${log//$'\n'/'%0A'}
            echo "::notice file=.github/workflows/build-manager-v36.yml,title=Full Gradle log::$log"
          fi

      - name: Upload manager build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-v36-build-log
          path: manager-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Compile admin licence app (debug APK, artifact only)
        working-directory: manager
        run: |
          set -o pipefail
          gradle :admin:assembleDebug --no-daemon 2>&1 | tee ../admin-build.log | tail -40

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meelano-admin-debug
          path: manager/admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify update descriptor tool (MAC round-trip, no publishing)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reldesc"
          javac -d "$RUNNER_TEMP/reldesc" manager/licensing/src/main/java/ir/meelano/licensing/License.java tools/release/ReleaseDescriptor.java
          SHA=$(printf 'meelano' | sha256sum | cut -d' ' -f1)
          java -cp "$RUNNER_TEMP/reldesc" ReleaseDescriptor 69 36.36.0 meelano-manager-v36.36.0-release.apk 1000 "$SHA" https://github.com/Companymeelano/Testt/releases/download/manager-v36.36.0/meelano-manager-v36.36.0-release.apk "test" | tee descriptor-check.json
          grep -F '"code": 69' descriptor-check.json

      - name: Verify APK identity, version and signature
        run: |
          set -euo pipefail
          mkdir -p dist
          cp manager/app/build/outputs/apk/debug/app-debug.apk dist/meelano-manager-v36-debug-18.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging dist/meelano-manager-v36-debug-18.apk | tee manager-badging.txt
          grep -F "package: name='ir.meelano.manager.debug' versionCode='69' versionName='36.36.0'" manager-badging.txt
          "$BT/apksigner" verify --verbose --print-certs dist/meelano-manager-v36-debug-18.apk | tee manager-signing.txt
          unzip -t dist/meelano-manager-v36-debug-18.apk | tail -1
          unzip -l dist/meelano-manager-v36-debug-18.apk | grep -F 'lib/arm64-v8a/libonnxruntime.so'
          APK_SIZE=$(stat -c %s dist/meelano-manager-v36-debug-18.apk)
          if [ "$APK_SIZE" -lt 60000000 ]; then echo "Expected the full offline-voice manager APK (~70 MB), got ${APK_SIZE} bytes"; exit 1; fi
          sha256sum dist/meelano-manager-v36-debug-18.apk

      - name: Upload manager APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meelano-manager-v36-debug-18
          path: dist/meelano-manager-v36-debug-18.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build signed release APK (runs only when release secrets are set)
        env:
          MEELANO_KEYSTORE_B64: ${{ secrets.MEELANO_KEYSTORE_B64 }}
          MEELANO_STORE_PASS: ${{ secrets.MEELANO_STORE_PASS }}
          MEELANO_KEY_ALIAS: ${{ secrets.MEELANO_KEY_ALIAS }}
          MEELANO_KEY_PASS: ${{ secrets.MEELANO_KEY_PASS }}
        working-directory: manager
        run: |
          set -euo pipefail
          if [ -z "${MEELANO_KEYSTORE_B64:-}" ]; then
            echo "Release signing secrets are not set; skipping the release build."
            exit 0
          fi
          echo "$MEELANO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/meelano-release.jks"
          export MEELANO_KEYSTORE="$RUNNER_TEMP/meelano-release.jks"
          gradle :app:assembleRelease --no-daemon --stacktrace
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='ir.meelano.manager' versionCode='69' versionName='36.36.0'"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee ../release-signing.txt
          cp "$APK" ../meelano-manager-v36-release.apk
          sha256sum ../meelano-manager-v36-release.apk

      - name: Upload signed release APK artifact (not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meelano-manager-v36-release
          path: meelano-manager-v36-release.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit verified APK to the session branch for direct delivery
        run: |
          set -euo pipefail
          # Another workflow can publish to this branch while this build runs (the unified app
          # build does exactly that). Start from the newest head of the branch, so the delivery
          # commit is a fast-forward and never loses that race.
          SOURCE_COMMIT=$(git rev-parse --short HEAD)
          git fetch origin arena/29e01a09-testt
          git reset --hard origin/arena/29e01a09-testt
          mkdir -p dist
          cp manager/app/build/outputs/apk/debug/app-debug.apk dist/meelano-manager-v36-debug-18.apk
          {
            echo "MEELANO Manager v36.36.0 (versionCode 69)"
            echo "Package: ir.meelano.manager.debug"
            echo "Build run: ${GITHUB_RUN_ID}"
            echo "Commit: ${SOURCE_COMMIT}"
            echo "SHA-256: $(sha256sum dist/meelano-manager-v36-debug-18.apk | cut -d' ' -f1)"
          } > dist/manager-v36-build-info.txt
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f dist/meelano-manager-v36-debug-18.apk dist/manager-v36-build-info.txt
          # A rebuild of the same sources produces the same bytes; committing it again would fail.
          if git diff --cached --quiet; then
            echo "APK and build info are unchanged; nothing to commit."
          else
            git commit -m "dist: MEELANO Manager v36.36.0 debug APK"
          fi
          git push origin HEAD:arena/29e01a09-testt

  buy-formula-counts:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[buy-check]')
    name: Restore sample and count formula matches (no business rows printed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="Atiran$(openssl rand -hex 24)!9a"
          echo "::add-mask::$password"
          echo "ATIRAN_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name atiran-sample \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Extract backup and copy it into the disposable database container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("Atiran2-1405-7-14-15-21-49.zip")
          target = Path("${{ runner.temp }}/AtiranSample.bak")
          with ZipFile(archive) as zf:
              matches = [name for name in zf.namelist() if name.lower().endswith(".bak")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one .bak in archive, found {len(matches)}")
              with zf.open(matches[0]) as source, target.open("wb") as dest:
                  while block := source.read(1024 * 1024):
                      dest.write(block)
          print("Extracted sample backup; this step reads no rows.")
          PY
          docker exec atiran-sample mkdir -p /var/opt/mssql/backup
          docker cp "${{ runner.temp }}/AtiranSample.bak" atiran-sample:/var/opt/mssql/backup/AtiranSample.bak

      - name: Count formula matches (aggregates only)
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/probe_buy_formula.py \
            --container atiran-sample \
            --backup /var/opt/mssql/backup/AtiranSample.bak \
            --output "${{ runner.temp }}/buy-formula-counts.json"
          cp "${{ runner.temp }}/buy-formula-counts.json" buy-formula-counts.json
          python3 tools/probe_money_structure.py \
            --container atiran-sample \
            --backup /var/opt/mssql/backup/AtiranSample.bak \
            --output "${{ runner.temp }}/money-structure-counts.json"
          cp "${{ runner.temp }}/money-structure-counts.json" money-structure-counts.json

      - name: Commit counts-only file to this branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f buy-formula-counts.json ]]; then echo "no counts file"; exit 0; fi
          mkdir -p dist
          cp buy-formula-counts.json dist/buy-formula-counts.json
          [[ -f money-structure-counts.json ]] && cp money-structure-counts.json dist/money-structure-counts.json || true
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f dist/buy-formula-counts.json dist/money-structure-counts.json 2>/dev/null || git add -f dist/buy-formula-counts.json
          git commit -m "dist: purchase formula counts (counts only, no rows)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin arena/29e01a09-testt && git push -q origin HEAD:arena/29e01a09-testt && break
            sleep 5
          done

      - name: Publish counts to run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f buy-formula-counts.json ]]; then
            { echo "## Purchase-line formula check (counts only)"; echo '```json'; cat buy-formula-counts.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Purchase-line formula check failed before producing counts" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Attach counts-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atiran-buy-formula-counts
          path: buy-formula-counts.json
          if-no-files-found: ignore
          retention-days: 14
