name: MEELANO Manager v36.26.0 debug APK

on:
  push:
    branches: ["arena/eec375ea-testt"]
    paths:
      - "manager/**"
      - "tools/audit_manager_schema.py"
      - ".github/workflows/build-manager-v36.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manager-v36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit required manager columns against the Atiran sample schema
        run: python3 tools/audit_manager_schema.py --manifest manager/app/src/test/resources/atiran/sample-schema.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android SDK 35
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run manager unit tests and build v36.26.0
        working-directory: manager
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../manager-build.log | tail -80

      - name: Include Gradle diagnostics in job summary
        if: failure()
        run: |
          if [ -f manager-build.log ]; then
            {
              echo '### Manager Gradle diagnostics (last 150 lines)'
              echo '```text'
              tail -n 150 manager-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            log=$(cat manager-build.log)
            log=${log//'%'/'%25'}
            log=${log//$'\r'/'%0D'}
            log=${log//$'\n'/'%0A'}
            echo "::notice file=.github/workflows/build-manager-v36.yml,title=Full Gradle log::$log"
          fi

      - name: Upload manager build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-v36-build-log
          path: manager-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK identity, version and signature
        run: |
          set -euo pipefail
          mkdir -p dist
          cp manager/app/build/outputs/apk/debug/app-debug.apk dist/meelano-manager-v36-debug-9.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging dist/meelano-manager-v36-debug-9.apk | tee manager-badging.txt
          grep -F "package: name='ir.meelano.manager.debug' versionCode='58' versionName='36.26.0'" manager-badging.txt
          "$BT/apksigner" verify --verbose --print-certs dist/meelano-manager-v36-debug-9.apk | tee manager-signing.txt
          unzip -t dist/meelano-manager-v36-debug-9.apk | tail -1
          sha256sum dist/meelano-manager-v36-debug-9.apk

      - name: Upload manager APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meelano-manager-v36-debug-9
          path: dist/meelano-manager-v36-debug-9.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified APK to the session branch for direct delivery
        run: |
          set -euo pipefail
          {
            echo "MEELANO Manager v36.26.0 (versionCode 58)"
            echo "Package: ir.meelano.manager.debug"
            echo "Build run: ${GITHUB_RUN_ID}"
            echo "Commit: $(git rev-parse --short HEAD)"
            echo "SHA-256: $(sha256sum dist/meelano-manager-v36-debug-9.apk | cut -d' ' -f1)"
          } > dist/manager-v36-build-info.txt
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f dist/meelano-manager-v36-debug-9.apk dist/manager-v36-build-info.txt
          git commit -m "dist: MEELANO Manager v36.26.0 debug APK"
          git push origin HEAD:arena/eec375ea-testt

  buy-formula-counts:
    if: github.event_name == 'workflow_dispatch'
    name: Restore sample and count formula matches (no business rows printed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="Atiran$(openssl rand -hex 24)!9a"
          echo "::add-mask::$password"
          echo "ATIRAN_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name atiran-sample \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Extract backup and copy it into the disposable database container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("Atiran2-1405-7-14-15-21-49.zip")
          target = Path("${{ runner.temp }}/AtiranSample.bak")
          with ZipFile(archive) as zf:
              matches = [name for name in zf.namelist() if name.lower().endswith(".bak")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one .bak in archive, found {len(matches)}")
              with zf.open(matches[0]) as source, target.open("wb") as dest:
                  while block := source.read(1024 * 1024):
                      dest.write(block)
          print("Extracted sample backup; this step reads no rows.")
          PY
          docker exec atiran-sample mkdir -p /var/opt/mssql/backup
          docker cp "${{ runner.temp }}/AtiranSample.bak" atiran-sample:/var/opt/mssql/backup/AtiranSample.bak

      - name: Count formula matches (aggregates only)
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/probe_buy_formula.py \
            --container atiran-sample \
            --backup /var/opt/mssql/backup/AtiranSample.bak \
            --output "${{ runner.temp }}/buy-formula-counts.json"
          cp "${{ runner.temp }}/buy-formula-counts.json" buy-formula-counts.json

      - name: Publish counts to run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f buy-formula-counts.json ]]; then
            { echo "## Purchase-line formula check (counts only)"; echo '```json'; cat buy-formula-counts.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Purchase-line formula check failed before producing counts" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Attach counts-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atiran-buy-formula-counts
          path: buy-formula-counts.json
          if-no-files-found: ignore
          retention-days: 14
