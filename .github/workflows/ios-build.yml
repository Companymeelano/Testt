name: iOS preinvoice (iPhone)

on:
  push:
    branches: ["arena/e7d9f96e-testt", "arena/29e01a09-testt"]
    paths:
      - "ios-invoice/**"
      - ".github/workflows/ios-build.yml"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Run iOS engine tests (SwiftPM, no signing — pure logic only)
        run: |
          set -o pipefail
          cd ios-invoice
          swift --version
          # Only the pure engine target is built on Linux; MeelanoApp (SwiftUI/UIKit)
          # is iOS-only and deliberately excluded here — it is verified by `swift build`
          # on macOS in the `build` job.
          swift test --filter MeelanoPreinvoiceTests --verbose 2>&1 | tee /tmp/ios-test.log | cat
          echo "=== swift test exit: $PIPESTATUS ==="

  build:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
      - name: Build unsigned IPA (installable on simulator / ad-hoc)
        run: |
          cd ios-invoice
          # SwiftPM library build proves the engine compiles; for a real IPA create
          # Meelano.xcodeproj (Xcode → New Project → App → SwiftUI, bundle id ir.meelano.preinvoice)
          # and point its sources to Sources/MeelanoPreinvoice + Sources/MeelanoApp.
          swift build -c release
          echo "SwiftPM build OK — open ios-invoice in Xcode and Archive for a signed IPA."
      - name: Upload SwiftPM build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preinvoice-sources
          path: ios-invoice
          retention-days: 7
