name: Visitor Android verification

on:
  push:
    branches: ["arena/7c541236-testt"]
    paths: ["app/**", "design/icons/visitor/**", "tools/verify_visitor_icons.py", ".github/workflows/visitor-preview.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visitor-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify local visitor icon assets
        run: python3 tools/verify_visitor_icons.py
      - name: Test and build visitor debug APK
        run: gradle -PmeelanoCompileSdk=35 testVisitorDebugUnitTest assembleVisitorDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: visitor-debug-apk
          path: app/build/outputs/apk/visitor/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      # The artifact download requires a GitHub login. This repository already keeps APKs in
      # dist/; publish the verified debug build there for a direct, public download as well.
      - name: Publish visitor debug APK to this branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/7c541236-testt'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Branch changed during the build; refusing to publish a stale APK." >&2
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/visitor/debug/app-visitor-debug.apk dist/visitor-preview-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/visitor-preview-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish visitor debug preview APK'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
