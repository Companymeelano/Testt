plugins {
    id 'com.android.application'
}

/*
 * This module file was reconstructed — the original zip shipped `src/` at the project root with
 * no `app/build.gradle` at all, while `settings.gradle` already did `include ':app'`, so nothing
 * could build. Every value below was read back out of the shipped artifact rather than guessed:
 *
 *   MEELANO-Manager-v6.0.1-release.apk!AndroidManifest.xml
 *       package / applicationId .... ir.meelano.manager   (manager flavour)
 *       versionCode ................ 110
 *       versionName ................ 6.2.0
 *       compileSdkVersion .......... 36  (codename "16")
 *       minSdkVersion .............. 24
 *       extractNativeLibs .......... false
 *   MEELANO-Manager-v6.0.1-release.apk!META-INF/com/android/build/gradle/app-metadata.properties
 *       androidGradlePluginVersion . 8.10.1               (matches the root build.gradle)
 *   MEELANO-Manager-v6.0.1-release.apk!META-INF/services/java.sql.Driver
 *       net.sourceforge.jtds.jdbc.Driver                  (the jTDS dependency below)
 *   MainActivity.java:3084  `ir.meelano.android.R.drawable.meelano_3d`
 *       namespace .................. ir.meelano.android
 *   MainActivity.java:890   "versionName without BuildConfig (buildConfig generation is off)"
 *       buildConfig ................ false                (BuildConfigSafe exists for this reason)
 *
 * Only `ir.meelano.manager` is verified from an APK. The other three applicationIds are marked
 * ASSUMED and should be corrected before those editions are published.
 */
android {
    namespace 'ir.meelano.android'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.meelano.android'
        minSdk 24
        targetSdk 36
        versionCode 110
        versionName '6.2.0'
    }

    // The app is built entirely in code; the only layout is the home-screen widget.
    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    /*
     * Four editions share this codebase and are told apart at runtime by a bool in
     * `res/values/edition.xml`, read in MainActivity.onCreate (line 345-349). Each flavour's
     * src/<name>/ supplies that bool plus its own launcher icons, colours and app name.
     * `visitor` deliberately has no src/visitor directory — it is plain src/main.
     */
    flavorDimensions += 'edition'
    productFlavors {
        visitor { dimension 'edition' }
        manager { dimension 'edition'; applicationId 'ir.meelano.manager' }      // verified from APK
        store   { dimension 'edition'; applicationId 'ir.meelano.android.store' } // ASSUMED
        staff   { dimension 'edition'; applicationId 'ir.meelano.android.staff' } // ASSUMED
        tax     { dimension 'edition'; applicationId 'ir.meelano.android.tax' }   // ASSUMED
    }

    /*
     * signing/meelano-install.p12 is in the repository but its passphrase is not (and must never
     * be committed). Release builds sign with it when the environment supplies the secrets —
     * locally or from GitHub Actions secrets — and otherwise fall back to the debug key so CI
     * still produces an installable APK instead of failing.
     */
    signingConfigs {
        meelano {
            def ks = rootProject.file('signing/meelano-install.p12')
            def storePw = System.getenv('MEELANO_KEYSTORE_PASSWORD')
            if (ks.exists() && storePw != null && !storePw.isEmpty()) {
                storeFile ks
                storeType 'PKCS12'
                storePassword storePw
                keyAlias System.getenv('MEELANO_KEY_ALIAS') ?: 'meelano'
                keyPassword System.getenv('MEELANO_KEY_PASSWORD') ?: storePw
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storePw = System.getenv('MEELANO_KEYSTORE_PASSWORD')
            signingConfig = (storePw != null && !storePw.isEmpty()) ? signingConfigs.meelano : signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Direct JDBC to SQL Server 2014 — no HTTP API anywhere in this app.
    // The driver is the one the shipped APK bundled (META-INF/services/java.sql.Driver).
    implementation 'net.sourceforge.jtds:jtds:1.3.1'

    // The Moadian and Labour-Law rules are pure Java, so they are unit-tested on the JVM.
    testImplementation 'junit:junit:4.13.2'
}
