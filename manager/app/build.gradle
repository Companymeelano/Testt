plugins { id 'com.android.application' }

android {
    namespace 'ir.meelano.manager'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.meelano.manager'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '9.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // No viewBinding / compose: the whole UI is hand-built Views (zero UI dependencies).
}

dependencies {
    // Direct SQL Server access (Atiran). The ONLY external dependency of the app.
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
}
