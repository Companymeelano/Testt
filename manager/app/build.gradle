plugins { id 'com.android.application' }

// The regular APK omits emulator-only ABIs to stay compact. The screenshot CI job
// opts into x86_64 so it can render real Android Views on a hosted emulator.
def managerAbis = ['arm64-v8a', 'armeabi-v7a']
if (project.hasProperty('homeScreenshotAbi')) managerAbis.add('x86_64')

// ---- Optional release signing ----
// Copy manager/keystore.properties.template → manager/keystore.properties (git-ignored)
// and point it at your release keystore. Env vars override the file.
// Without it, `assembleRelease` builds unsigned; CI keeps shipping debug.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def hasSigning = keystoreFile.exists() || System.getenv('MEELANO_KEYSTORE') != null

android {
    namespace 'ir.meelano.manager'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.meelano.manager'
        minSdk 26
        targetSdk 34
        versionCode 76
        versionName '36.43.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        // Built-in Persian voice (sherpa-onnx) ships for phones; CI may opt into x86_64 for UI screenshots.
        ndk { abiFilters(*managerAbis) }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(keystoreProps.getProperty('storeFile', System.getenv('MEELANO_KEYSTORE') ?: 'meelano-release.jks'))
                storePassword keystoreProps.getProperty('storePassword', System.getenv('MEELANO_STORE_PASS') ?: '')
                keyAlias keystoreProps.getProperty('keyAlias', System.getenv('MEELANO_KEY_ALIAS') ?: 'meelano')
                keyPassword keystoreProps.getProperty('keyPassword', System.getenv('MEELANO_KEY_PASS') ?: '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // No viewBinding / compose: the whole UI is hand-built Views (zero UI dependencies).
}

dependencies {
    // Direct SQL Server access (Atiran) + QR codes for the shop card. The ONLY external dependencies.
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
    implementation 'com.google.zxing:core:3.5.3'
    // Offline license vault (shared codec with the seller admin app).
    implementation project(':licensing')

    // Offline Persian voice engine: pinned AAR fetched by CI into libs/ (see .github workflows), plus tar.bz2 unpacking for the model.
    implementation(name: 'sherpa-onnx-1.13.8', ext: 'aar')
    // The local AAR does not declare its Kotlin runtime, so the stdlib it calls is added here (else: NoClassDefFoundError kotlin/jvm/internal).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'org.apache.commons:commons-compress:1.27.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
