      <stop offset="0" stop-color="#16405F"/>
      <stop offset="1" stop-color="#0A1A30"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <path d="M28,4 H68 Q92,4 92,28 V68 Q92,92 68,92 H28 Q4,92 4,68 V28 Q4,4 28,4 Z" fill="url(#tile)"/>
